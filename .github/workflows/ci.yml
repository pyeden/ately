name: ci
on: [push, pull_request]
jobs:
  migrate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ["16", "17"]
        timescale: ["none"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env: {POSTGRES_PASSWORD: ately, POSTGRES_DB: ately}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      PGPASSWORD: ately
    steps:
      - uses: actions/checkout@v4
      - name: baseline on fresh database
        run: psql -h localhost -U ately -d ately -v ON_ERROR_STOP=1 -f db/baseline/baseline.sql
      - name: structure guards
        run: psql -h localhost -U ately -d ately -v ON_ERROR_STOP=1 -f db/ci/verify_guards.sql
      - name: behavior guards (freeze / FK / judge)
        run: psql -h localhost -U ately -d ately -v ON_ERROR_STOP=1 -f db/ci/verify_behaviors.sql
      - name: api smoke loop
        run: |
          pip install -r server/requirements.txt
          python -m uvicorn server.main:app --port 8080 &
          sleep 3
          curl -sf -X POST localhost:8080/seed > /tmp/seed.json
          PID=$(python -c "import json;print(json.load(open('/tmp/seed.json'))['project_id'])")
          TASK=$(curl -sf -X POST localhost:8080/projects/$PID/tasks | python -c "import json,sys;print(json.load(sys.stdin)['task_id'])")
          RUN=$(curl -sf -X POST -H "Idempotency-Key: k1" localhost:8080/tasks/$TASK/runs | python -c "import json,sys;print(json.load(sys.stdin)['run_id'])")
          curl -sf localhost:8080/runs/$RUN | grep -q SUCCEEDED
          # idempotency: replay returns same run
          RUN2=$(curl -sf -X POST -H "Idempotency-Key: k1" localhost:8080/tasks/$TASK/runs | python -c "import json,sys;print(json.load(sys.stdin)['run_id'])")
          [ "$RUN" = "$RUN2" ]
