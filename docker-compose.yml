services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ately
      POSTGRES_PASSWORD: ately
      POSTGRES_DB: ately
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/baseline/baseline.sql:/docker-entrypoint-initdb.d/01-baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ately -d ately"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://ately:ately@db:5432/ately
      WATCHFILES_FORCE_POLLING: "true"
    ports: ["8080:8080"]
    volumes:
      - ./server:/app/server
    command: >
      uvicorn server.main:app
      --host 0.0.0.0 --port 8080
      --reload --reload-dir /app/server
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: